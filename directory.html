<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Directory — AllSeattle</title>
<meta name="description" content="Browse Seattle businesses by category on AllSeattle.">
<link rel="icon" type="image/svg+xml" href="img/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero/skyline-panorama.webp">
<link rel="stylesheet" href="css/tokens.css?v=20260926k">
<link rel="stylesheet" href="css/base.css?v=20260926k">
<link rel="stylesheet" href="css/header.css?v=20260926k">
<link rel="stylesheet" href="css/footer.css?v=20260926k">
<link rel="stylesheet" href="css/components.css?v=20260926k">
<link rel="stylesheet" href="css/pages/directory.css?v=20260926k">
</head>
<body data-page-type="inner" data-page="directory">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="directory-top" class="ad-slot-top"></div>

      <div class="section-head">
        <div>
          <span class="eyebrow">Business Directory</span>
          <h1>Find a Seattle Business</h1>
        </div>
        <a href="pricing.html" class="btn">List Your Business</a>
      </div>

      <div class="dir-layout">
        <aside class="dir-rail dir-rail--left">
          <div class="widget" id="widget-categories"></div>
        </aside>

        <div class="dir-main">
          <form class="dir-search" id="dir-search" role="search" novalidate>
            <input type="search" id="dir-q" name="q" placeholder="I am looking for..."
                   aria-label="Search the business directory" autocomplete="off">
          </form>
          <p class="result-count" id="dir-count"></p>
          <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="dir-list-top" class="ad-slot-top"></div>
          <div class="biz-list" id="biz-list"></div>
          <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="dir-list-bottom" class="ad-slot-bottom"></div>
        </div>

        <aside class="dir-rail dir-rail--right">
          <div data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="directory-side-1"></div>
          <div class="widget" id="widget-stats"></div>
          <div data-ad-slot="300x600" data-ad-slot-mobile="320x100" data-ad-seed="directory-side-2"></div>
        </aside>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/partials.js"></script>
<script type="module" src="js/banner-ads.js"></script>
<script type="module" src="js/pages/directory.js"></script>
</body>
</html>
