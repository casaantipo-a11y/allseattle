<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Directory — AllSeattle</title>
<meta name="description" content="Browse Seattle businesses by category on AllSeattle.">
<link rel="icon" type="image/svg+xml" href="img/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/directory.css">
</head>
<body data-page-type="inner" data-page="directory">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="directory-top" class="ad-slot-top"></div>

      <div class="section-head">
        <div>
          <span class="eyebrow">Business Directory</span>
          <h1>Find a Seattle Business</h1>
        </div>
        <a href="pricing.html" class="btn">List Your Business</a>
      </div>

      <div class="category-filter" id="category-filter"></div>

      <div class="directory-layout">
        <div class="grid biz-grid" id="biz-grid"></div>
        <aside class="directory-sidebar">
          <div class="ad-desktop-slot" data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="directory-side-1"></div>
          <div class="ad-desktop-slot" data-ad-slot="300x600" data-ad-slot-mobile="320x100" data-ad-seed="directory-side-2"></div>
        </aside>
      </div>

      <div class="mobile-footer-ads" id="mobile-footer-ads"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/partials.js"></script>
<script type="module" src="js/banner-ads.js"></script>
<script type="module" src="js/pages/directory.js"></script>
</body>
</html>
