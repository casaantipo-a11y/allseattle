<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — AllSeattle</title>
<meta name="description" content="Current conditions and the seven-day forecast for Seattle.">
<link rel="icon" type="image/svg+xml" href="img/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero/skyline-panorama.webp">
<link rel="stylesheet" href="css/tokens.css?v=20260928a">
<link rel="stylesheet" href="css/base.css?v=20260928a">
<link rel="stylesheet" href="css/header.css?v=20260928a">
<link rel="stylesheet" href="css/footer.css?v=20260928a">
<link rel="stylesheet" href="css/components.css?v=20260928a">
<link rel="stylesheet" href="css/pages/weather.css?v=20260928a">
</head>
<body data-page-type="inner" data-page="weather">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="weather-top" class="ad-slot-top"></div>

      <div class="section-head section-head--sub">
        <div>
          <span class="eyebrow">Seattle Forecast</span>
          <h1>Weather</h1>
        </div>
        <a href="pricing.html" class="btn">Advertise Here</a>
      </div>

      <!-- Панель погоды собрана по макету-дашборду, который прислал клиент
           (27.09.2026): слева текущая погода, справа Today / Week, °C / °F и
           шесть карточек «Today's Highlights». Цвета — сайта, а не макета. -->
      <div class="wx-board">
        <div class="wx-now" id="wx-now"></div>

        <div class="wx-main">
          <div class="wx-toolbar">
            <div class="wx-tabs" role="tablist" aria-label="Forecast range">
              <button type="button" class="wx-tab" role="tab" data-view="today" aria-selected="false">Today</button>
              <button type="button" class="wx-tab" role="tab" data-view="week" aria-selected="true">Week</button>
            </div>
            <div class="wx-units" role="group" aria-label="Temperature unit">
              <button type="button" class="wx-unit" data-unit="c" aria-pressed="false">&deg;C</button>
              <button type="button" class="wx-unit" data-unit="f" aria-pressed="true">&deg;F</button>
            </div>
          </div>

          <div class="wx-strip" id="wx-strip"></div>

          <h2 class="wx-h">Today&rsquo;s Highlights</h2>
          <div class="wx-highlights" id="wx-highlights"></div>
        </div>
      </div>

      <h2 class="weather-h">Around the region</h2>
      <div class="weather-region" id="weather-region"></div>


    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/partials.js"></script>
<script type="module" src="js/banner-ads.js"></script>
<script type="module" src="js/pages/weather.js"></script>
</body>
</html>
