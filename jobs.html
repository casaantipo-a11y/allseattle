<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — AllSeattle</title>
<meta name="description" content="Job openings across Seattle, posted by local businesses.">
<link rel="icon" type="image/svg+xml" href="img/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero/skyline-panorama.webp">
<link rel="stylesheet" href="css/tokens.css?v=20260926y">
<link rel="stylesheet" href="css/base.css?v=20260926y">
<link rel="stylesheet" href="css/header.css?v=20260926y">
<link rel="stylesheet" href="css/footer.css?v=20260926y">
<link rel="stylesheet" href="css/components.css?v=20260926y">
<link rel="stylesheet" href="css/pages/jobs.css?v=20260926y">
</head>
<body data-page-type="inner" data-page="jobs">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="jobs-top" class="ad-slot-top"></div>

      <div class="section-head">
        <div>
          <span class="eyebrow">Work in Seattle</span>
          <h1>Job Board</h1>
        </div>
        <a href="pricing.html" class="btn">Post a Job</a>
      </div>

      <div class="category-filter" id="category-filter"></div>

      <div class="jobs-layout side-layout">
        <div>
          <p class="result-count" id="jobs-count"></p>
          <div class="job-list" id="job-list"></div>
        </div>
        <aside class="jobs-sidebar side-rail">
          <div class="ad-desktop-slot" data-ad-slot="300x250" data-ad-slot-mobile="320x100" data-ad-seed="jobs-side-1"></div>
          <div class="ad-desktop-slot" data-ad-slot="300x600" data-ad-slot-mobile="320x100" data-ad-seed="jobs-side-2"></div>
        </aside>
      </div>

      <div class="mobile-footer-ads" id="mobile-footer-ads"></div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/partials.js"></script>
<script type="module" src="js/banner-ads.js"></script>
<script type="module" src="js/pages/jobs.js"></script>
</body>
</html>
