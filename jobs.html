<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — AllSeattle</title>
<meta name="description" content="Job openings across Seattle, posted by local businesses.">
<link rel="icon" type="image/svg+xml" href="img/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero/skyline-panorama.webp">
<link rel="stylesheet" href="css/tokens.css?v=20260927t">
<link rel="stylesheet" href="css/base.css?v=20260927t">
<link rel="stylesheet" href="css/header.css?v=20260927t">
<link rel="stylesheet" href="css/footer.css?v=20260927t">
<link rel="stylesheet" href="css/components.css?v=20260927t">
<link rel="stylesheet" href="css/pages/jobs.css?v=20260927t">
</head>
<body data-page-type="inner" data-page="jobs">

<div id="site-header"></div>

<main>
  <section class="section">
    <div class="container">
      <div data-ad-slot="728x90" data-ad-slot-mobile="320x100" data-ad-seed="jobs-top" class="ad-slot-top"></div>

      <div class="section-head section-head--sub jobs-head">
        <div>
          <span class="eyebrow">Work in Seattle</span>
          <h1>Job Board</h1>
        </div>
        <a href="pricing.html" class="btn">Post a Job</a>
      </div>

      <!-- Раздел собран по образцу work.ua, который прислал клиент: колонка
           фильтров и плотные карточки вакансий. Колонка слева, а не справа как
           в макете — так же, как рубрики в справочнике и каталог в Auto; это
           выбор клиента. Рекламы в колонке нет: боковые места с этой страницы
           сняты отдельной просьбой. -->
      <div class="jobs-layout">
        <aside class="jobs-filters">
          <button class="jobs-filters-toggle" id="jobs-filters-toggle" type="button"
                  aria-expanded="false" aria-controls="jobs-filters-body">Filters</button>
          <div class="jobs-filters-body" id="jobs-filters-body">
            <div class="widget">
              <div class="widget-head">Filters</div>
              <div class="widget-body" id="jobs-filter-groups"></div>
            </div>
          </div>
        </aside>

        <div class="jobs-results">
          <div class="jobs-toolbar">
            <p class="result-count" id="jobs-count"></p>
            <label class="jobs-sort">
              <span>Sort by</span>
              <select id="jobs-sort">
                <option value="newest">Newest first</option>
                <option value="salary-desc">Salary: high to low</option>
                <option value="salary-asc">Salary: low to high</option>
                <option value="company">Company A–Z</option>
              </select>
            </label>
          </div>
          <div class="job-list" id="job-list"></div>
        </div>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="js/partials.js"></script>
<script type="module" src="js/banner-ads.js"></script>
<script type="module" src="js/pages/jobs.js"></script>
</body>
</html>
